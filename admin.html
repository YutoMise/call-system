<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャンネル管理 - 管理者ページ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 95%;
            max-width: 1200px;
        }
        
        .login-form {
            text-align: center;
        }
        
        .admin-panel {
            display: none;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        h2 {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"], input[type="password"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            height: 300px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-danger {
            background: #dc3545;
        }
        
        .message {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-nav {
            display: flex;
            align-items: center;
        }

        .btn-info {
            background-color: #17a2b8;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-info:hover {
            background-color: #138496;
            color: white;
            text-decoration: none;
        }
        
        .current-data {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .current-data h3 {
            color: #495057;
            margin-bottom: 10px;
        }
        
        .channel-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            padding: 15px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .channel-info-display {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .channel-name {
            font-weight: bold;
            color: #495057;
        }
        
        .channel-password {
            font-family: 'Courier New', monospace;
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .voice-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 0.85em;
            text-align: right;
        }
        
        .voice-lang {
            color: #6c757d;
            font-family: 'Courier New', monospace;
        }
        
        .help-text {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        /* 新しいチャンネル管理UI用のスタイル */
        .add-channel-form {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .add-channel-form h3 {
            color: #495057;
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: end;
        }

        .form-row .form-group {
            flex: 1 1 150px;
            margin-bottom: 0;
        }

        .form-row .form-group.reception-group {
            flex: 0 0 100px;
            text-align: center;
        }

        .form-row .form-group.button-group {
            flex: 0 0 auto;
        }

        /* チェックボックスのスタイル調整 */
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            vertical-align: middle;
        }

        .channels-list {
            margin-bottom: 30px;
        }

        .channels-list h3 {
            color: #495057;
            margin-bottom: 15px;
        }

        .channel-row {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .channel-info-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .channel-field label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 3px;
        }

        .channel-field input,
        .channel-field select {
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
        }

        .channel-field.reception-field {
            text-align: center;
            align-self: center;
        }

        .channel-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            margin: 0;
        }

        .btn-primary {
            background: #007bff;
        }

        .btn-success {
            background: #28a745;
        }

        .json-editor-section {
            border-top: 1px solid #dee2e6;
            padding-top: 20px;
        }

        .json-editor-section details summary {
            cursor: pointer;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .action-buttons {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ログインフォーム -->
        <div id="loginForm" class="login-form">
            <h1>管理者ログイン</h1>
            <div class="form-group">
                <label for="username">ユーザー名:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード:</label>
                <input type="password" id="password" required>
            </div>
            <button class="btn" onclick="login()">ログイン</button>
            <div id="loginMessage" class="message"></div>
        </div>
        
        <!-- 管理者パネル -->
        <div id="adminPanel" class="admin-panel">
            <div class="header">
                <h1>チャンネル管理</h1>
                <div class="admin-nav">
                    <a href="/admin/logs" class="btn btn-info" target="_blank" style="margin-right: 10px;">📋 システムログ</a>
                    <button class="btn btn-secondary" onclick="logout()">ログアウト</button>
                </div>
            </div>
            
            <div class="current-data">
                <h3>現在のチャンネル設定</h3>
                <div id="currentChannels"></div>
            </div>
            
            <h2>チャンネル管理</h2>

            <!-- 新しいチャンネル追加フォーム -->
            <div class="add-channel-form">
                <h3>新しいチャンネルを追加</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="newChannelName">チャンネル名:</label>
                        <input type="text" id="newChannelName" placeholder="チャンネル名">
                    </div>
                    <div class="form-group">
                        <label for="newChannelPassword">パスワード:</label>
                        <input type="password" id="newChannelPassword" placeholder="パスワード">
                    </div>
                    <div class="form-group">
                        <label>日本語音声ID:</label>
                        <select id="newChannelJaVoiceId"></select>
                    </div>
                    <div class="form-group">
                        <label>英語音声ID:</label>
                        <select id="newChannelEnVoiceId"></select>
                    </div>
                    <div class="form-group">
                        <label>中国語音声ID:</label>
                        <select id="newChannelCnVoiceId"></select>
                    </div>
                    <div class="form-group">
                        <label for="newChannelRoomCount">診察室数:</label>
                        <input type="number" id="newChannelRoomCount" min="1" max="10" value="7">
                    </div>
                    <div class="form-group reception-group">
                        <label for="newChannelUseReception">受付使用:</label>
                        <input type="checkbox" id="newChannelUseReception" checked>
                    </div>
                    <div class="form-group reception-group">
                        <label for="newChannelUseXray">レントゲン室使用:</label>
                        <input type="checkbox" id="newChannelUseXray">
                    </div>
                    <div class="form-group button-group">
                        <button class="btn btn-primary" onclick="addChannel()">追加</button>
                    </div>
                </div>
            </div>

            <!-- チャンネル一覧 -->
            <div class="channels-list">
                <h3>チャンネル一覧</h3>
                <div id="channelsList"></div>
            </div>

            <!-- JSON編集セクション -->
            <div class="json-editor-section">
                <details>
                    <summary>JSON直接編集（上級者向け）</summary>
                    <div class="form-group">
                        <label for="channelsJson">チャンネル設定JSON:</label>
                        <textarea id="channelsJson" placeholder="チャンネル設定をJSON形式で入力してください..."></textarea>
                    </div>
                    <button class="btn" onclick="saveChannelsFromJson()">JSON から保存</button>
                </details>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="loadChannels()">リロード</button>
                <button class="btn btn-danger" onclick="resetToDefault()">デフォルトに戻す</button>
            </div>

            <div id="adminMessage" class="message"></div>
        </div>
    </div>

    <script>
        // グローバル変数として利用可能な音声リストを保持
        let availableVoices = { japanese: [], english: [], chinese: [] };

        // 認証状態をチェック
        async function checkAuthStatus() {
            try {
                const response = await fetch('/admin/api/auth-status');
                const data = await response.json();
                if (data.isAuthenticated) {
                    showAdminPanel();
                    await loadAvailableVoices();
                    await loadChannels();
                } else {
                    showLoginForm();
                }
            } catch (error) {
                console.error('認証状態の確認に失敗:', error);
                showLoginForm();
            }
        }
        
        // ログイン処理
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage('loginMessage', 'ユーザー名とパスワードを入力してください。', 'error');
                return;
            }
            
            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAdminPanel();
                    await loadAvailableVoices();
                    await loadChannels();
                } else {
                    showMessage('loginMessage', data.message, 'error');
                }
            } catch (error) {
                showMessage('loginMessage', 'ログインに失敗しました。', 'error');
            }
        }
        
        // ログアウト処理
        async function logout() {
            try {
                await fetch('/admin/logout', { method: 'POST' });
                showLoginForm();
            } catch (error) {
                console.error('ログアウトに失敗:', error);
            }
        }

        // 利用可能な音声リストをサーバーから取得
        async function loadAvailableVoices() {
            try {
                const response = await fetch('/admin/api/pregenerated-voices');
                if (response.status === 401) {
                    showLoginForm();
                    return;
                }
                const data = await response.json();
                if (data.success) {
                    availableVoices = {
                        japanese: data.japanese || [],
                        english: data.english || [],
                        chinese: data.chinese || []
                    };
                    populateNewChannelVoiceSelectors();
                } else {
                    throw new Error(data.message || 'Failed to load voices');
                }
            } catch (error) {
                console.error('音声リストの読み込みに失敗:', error);
                showMessage('adminMessage', '利用可能な音声リストの読み込みに失敗しました。', 'error');
            }
        }
        
        // チャンネル情報を読み込み
        async function loadChannels() {
            try {
                const response = await fetch('/admin/api/channels');
                if (response.status === 401) {
                    showLoginForm();
                    return;
                }

                const channels = await response.json();
                document.getElementById('channelsJson').value = JSON.stringify(channels, null, 2);
                displayCurrentChannels(channels);
                displayChannelsList(channels);

            } catch (error) {
                showMessage('adminMessage', 'チャンネル情報の読み込みに失敗しました。', 'error');
            }
        }
        
        // 現在のチャンネル情報を表示
        function displayCurrentChannels(channels) {
            const container = document.getElementById('currentChannels');
            container.innerHTML = '';

            channels.forEach(channel => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                const jaVoice = getDisplayVoiceName(channel, 'japanese') || '未設定';
                const enVoice = getDisplayVoiceName(channel, 'english') || '未設定';
                const cnVoice = getDisplayVoiceName(channel, 'chinese') || '未設定';
                div.innerHTML = `
                    <div class="channel-info-display">
                        <span class="channel-name">${escapeHtml(channel.name)}</span>
                        <span class="channel-password">パスワード: ${escapeHtml(channel.password)}</span>
                    </div>
                    <div class="voice-info">
                        <div class="voice-lang">日本語: ${escapeHtml(jaVoice)}</div>
                        <div class="voice-lang">English: ${escapeHtml(enVoice)}</div>
                        <div class="voice-lang">中文: ${escapeHtml(cnVoice)}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // チャンネル一覧を表示（編集可能）
        function displayChannelsList(channels) {
            const container = document.getElementById('channelsList');
            container.innerHTML = '';

            channels.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = 'channel-row';

                const jaSelectHtml = createVoiceSelectorHTML('japanese', getVoiceId(channel, 'japanese'), index);
                const enSelectHtml = createVoiceSelectorHTML('english', getVoiceId(channel, 'english'), index);
                const cnSelectHtml = createVoiceSelectorHTML('chinese', getVoiceId(channel, 'chinese'), index);

                div.innerHTML = `
                <div class="channel-info-grid">
                    <div class="channel-field">
                        <label for="channelName_${index}">チャンネル名</label>
                        <input type="text" value="${escapeHtml(channel.name)}" id="channelName_${index}">
                    </div>
                    <div class="channel-field">
                        <label for="channelPassword_${index}">パスワード</label>
                        <input type="password" value="${escapeHtml(channel.password)}" id="channelPassword_${index}">
                    </div>
                    <div class="channel-field">
                        <label for="channelJaVoiceId_${index}">日本語音声ID</label>
                        ${jaSelectHtml}
                    </div>
                    <div class="channel-field">
                        <label for="channelEnVoiceId_${index}">英語音声ID</label>
                        ${enSelectHtml}
                    </div>
                    <div class="channel-field">
                        <label for="channelCnVoiceId_${index}">中国語音声ID</label>
                        ${cnSelectHtml}
                    </div>
                    <div class="channel-field">
                        <label for="channelRoomCount_${index}">診察室数</label>
                        <input type="number" min="1" max="10" value="${channel.roomCount || 7}" id="channelRoomCount_${index}">
                    </div>
                    <div class="channel-field reception-field">
                        <label for="channelUseReception_${index}">受付使用</label>
                        <input type="checkbox" ${channel.useReception !== false ? 'checked' : ''} id="channelUseReception_${index}">
                    </div>
                    <div class="channel-field reception-field">
                        <label for="channelUseXray_${index}">レントゲン室使用</label>
                        <input type="checkbox" ${channel.useXray === true ? 'checked' : ''} id="channelUseXray_${index}">
                    </div>
                </div>
                <div class="channel-actions">
                    <button class="btn btn-success btn-small" onclick="updateChannel(${index})">更新</button>
                    <button class="btn btn-danger btn-small" onclick="deleteChannel(${index})">削除</button>
                </div>
                `;
                container.appendChild(div);
            });
        }

        // 新規追加フォームの音声セレクターを埋める
        function populateNewChannelVoiceSelectors() {
            populateVoiceSelector('newChannelJaVoiceId', availableVoices.japanese);
            populateVoiceSelector('newChannelEnVoiceId', availableVoices.english);
            populateVoiceSelector('newChannelCnVoiceId', availableVoices.chinese);
        }

        function populateVoiceSelector(selectId, voices) {
            const select = document.getElementById(selectId);
            select.innerHTML = '';
            voices.forEach(voiceId => {
                const option = document.createElement('option');
                option.value = voiceId;
                option.textContent = voiceId;
                select.appendChild(option);
            });
        }

        function createVoiceSelectorHTML(lang, selectedVoiceId, index) {
            let langPrefix;
            if (lang === 'japanese') langPrefix = 'Ja';
            else if (lang === 'english') langPrefix = 'En';
            else if (lang === 'chinese') langPrefix = 'Cn';
            else langPrefix = lang.slice(0, 2); // Fallback
            const voices = availableVoices[lang] || [];
            let options = voices.map(voice =>
                `<option value="${escapeHtml(voice)}" ${voice === selectedVoiceId ? 'selected' : ''}>${escapeHtml(voice)}</option>`
            ).join('');
            return `<select id="channel${langPrefix}VoiceId_${index}">${options}</select>`;
        }
        
        // 新しいチャンネルを追加
        async function addChannel() {
            const name = document.getElementById('newChannelName').value.trim();
            const password = document.getElementById('newChannelPassword').value.trim();
            const jaVoiceId = document.getElementById('newChannelJaVoiceId').value;
            const enVoiceId = document.getElementById('newChannelEnVoiceId').value;
            const cnVoiceId = document.getElementById('newChannelCnVoiceId').value;
            const roomCount = parseInt(document.getElementById('newChannelRoomCount').value) || 7;
            const useReception = document.getElementById('newChannelUseReception').checked;
            const useXray = document.getElementById('newChannelUseXray').checked;

            if (!name || !password) {
                return showMessage('adminMessage', 'チャンネル名とパスワードを入力してください。', 'error');
            }
            if (roomCount < 1 || roomCount > 10) {
                return showMessage('adminMessage', '診察室数は1-10の範囲で入力してください。', 'error');
            }

            try {
                const response = await fetch('/admin/api/channels');
                if (response.status === 401) return showLoginForm();
                const channels = await response.json();

                if (channels.some(channel => channel.name === name)) {
                    return showMessage('adminMessage', 'そのチャンネル名は既に存在します。', 'error');
                }

                const newChannel = {
                    name, password, roomCount, useReception, useXray,
                    voiceConfig: {
                        japanese: { voiceId: jaVoiceId },
                        english: { voiceId: enVoiceId },
                        chinese: { voiceId: cnVoiceId }
                    }
                };
                channels.push(newChannel);

                await saveChannelsData(channels);
                document.getElementById('newChannelName').value = '';
                document.getElementById('newChannelPassword').value = '';
            } catch (error) {
                showMessage('adminMessage', 'チャンネルの追加に失敗しました。', 'error');
            }
        }

        // チャンネルを更新
        async function updateChannel(index) {
            const name = document.getElementById(`channelName_${index}`).value.trim();
            const password = document.getElementById(`channelPassword_${index}`).value.trim();
            const jaVoiceId = document.getElementById(`channelJaVoiceId_${index}`).value;
            const enVoiceId = document.getElementById(`channelEnVoiceId_${index}`).value;
            const cnVoiceId = document.getElementById(`channelCnVoiceId_${index}`).value;
            const roomCount = parseInt(document.getElementById(`channelRoomCount_${index}`).value) || 7;
            const useReception = document.getElementById(`channelUseReception_${index}`).checked;
            const useXray = document.getElementById(`channelUseXray_${index}`).checked;

            if (!name || !password) {
                return showMessage('adminMessage', 'チャンネル名とパスワードを入力してください。', 'error');
            }
            if (roomCount < 1 || roomCount > 10) {
                return showMessage('adminMessage', '診察室数は1-10の範囲で入力してください。', 'error');
            }

            try {
                const response = await fetch('/admin/api/channels');
                if (response.status === 401) return showLoginForm();
                const channels = await response.json();

                if (channels.some((channel, i) => i !== index && channel.name === name)) {
                    return showMessage('adminMessage', 'そのチャンネル名は既に存在します。', 'error');
                }

                channels[index] = {
                    name, password, roomCount, useReception, useXray,
                    voiceConfig: {
                        japanese: { voiceId: jaVoiceId },
                        english: { voiceId: enVoiceId },
                        chinese: { voiceId: cnVoiceId }
                    }
                };
                await saveChannelsData(channels);
            } catch (error) {
                showMessage('adminMessage', 'チャンネルの更新に失敗しました。', 'error');
            }
        }

        // チャンネルを削除
        async function deleteChannel(index) {
            if (!confirm('このチャンネルを削除しますか？')) return;

            try {
                const response = await fetch('/admin/api/channels');
                if (response.status === 401) return showLoginForm();
                const channels = await response.json();
                channels.splice(index, 1);
                await saveChannelsData(channels);
            } catch (error) {
                showMessage('adminMessage', 'チャンネルの削除に失敗しました。', 'error');
            }
        }

        // チャンネルデータを保存（共通関数）
        async function saveChannelsData(channels) {
            const response = await fetch('/admin/api/channels', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(channels)
            });

            if (response.status === 401) return showLoginForm();
            const data = await response.json();

            if (data.success) {
                showMessage('adminMessage', data.message, 'success');
                document.getElementById('channelsJson').value = JSON.stringify(channels, null, 2);
                displayCurrentChannels(channels);
                displayChannelsList(channels);
            } else {
                showMessage('adminMessage', data.message, 'error');
            }
        }

        // JSONから保存
        async function saveChannelsFromJson() {
            const jsonText = document.getElementById('channelsJson').value;
            try {
                const channels = JSON.parse(jsonText);
                await saveChannelsData(channels);
            } catch (error) {
                showMessage('adminMessage', error instanceof SyntaxError ? 'JSON形式が正しくありません。' : '保存に失敗しました。', 'error');
            }
        }
        
        // デフォルト設定に戻す
        async function resetToDefault() {
            if (confirm('デフォルト設定に戻しますか？この操作は取り消せません。')) {
                try {
                    const response = await fetch('/admin/api/channels/default', { method: 'POST' });
                    const data = await response.json();
                    if(data.success) {
                        await saveChannelsData(data.channels);
                    } else {
                        showMessage('adminMessage', 'デフォルト設定の取得に失敗しました。', 'error');
                    }
                } catch (error) {
                    showMessage('adminMessage', 'デフォルト設定への復元に失敗しました。', 'error');
                }
            }
        }
        
        // UI表示切り替え
        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }
        
        function showAdminPanel() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }
        
        // メッセージ表示
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 5000);
        }
        
        // HTMLエスケープ
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // voiceConfig対応のヘルパー関数
        function getVoiceId(channel, language) {
            return channel.voiceConfig?.[language]?.voiceId || null;
        }

        function getDisplayVoiceName(channel, language) {
            return getVoiceId(channel, language);
        }
        
        // 初期化処理
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('password').addEventListener('keypress', e => {
                if (e.key === 'Enter') login();
            });
            checkAuthStatus();
        });
    </script>
</body>
</html>
